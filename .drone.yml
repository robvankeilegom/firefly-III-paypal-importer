---
kind: pipeline
name: Build Docker for specific tag
depends_on:
  - Default

trigger:
  event:
    include:
      - tag

steps:
  - name: Build Docker container
    image: docker@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t robvankeilegom/firefly-iii-paypal-importer:$DRONE_TAG .

  - name: Publish Docker container
    image: docker@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
    environment:
      DOCKER_USER:
        from_secret: docker_username
      DOCKER_PW:
        from_secret: docker_password
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - echo $DOCKER_PW | docker login --username $DOCKER_USER --password-stdin
      - docker push robvankeilegom/firefly-iii-paypal-importer:$DRONE_TAG

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
